spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fin}
    username: ${DB_USER:fin}
    password: ${DB_PASSWORD:fin}
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true

logging:
  level:
    com.fintracker: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET:ZmludHJhY2tlci1kZXYtc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=}
  access-expiration: 3600000
  refresh-expiration: 2592000000

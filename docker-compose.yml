services:
  postgres:
    image: postgres:16-alpine
    container_name: fin-db
    environment:
      POSTGRES_DB: fin
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fin-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fin
      DB_USER: fin
      DB_PASSWORD: fin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

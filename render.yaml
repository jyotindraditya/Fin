services:
  - type: web
    name: fin-api
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: fin-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fin-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fin-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fin-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fin-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        fromService:
          type: web
          name: fin-frontend
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /actuator/health

  - type: web
    name: fin-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fin-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: fin-db
    plan: free
    databaseName: fin
    user: fin
